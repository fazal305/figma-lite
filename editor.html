<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor | Figma Lite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/editor.css" />
  </head>
  <body data-page="editor">
    <div class="app-shell">
      <div data-sidebar></div>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-eyebrow">Canvas Editor</p>
            <h1 class="page-title">Infinite Design Canvas</h1>
            <p class="page-description">
              Create shapes and text, select, move, resize, pan, zoom, snap to
              grid, and save the design state.
            </p>
          </div>
        </header>

        <section class="editor-layout">
          <aside class="glass-card editor-toolbar">
            <button class="tool-btn active" data-tool="select" title="Select">
              ↖
            </button>
            <button class="tool-btn" data-tool="rectangle" title="Rectangle">
              ▭
            </button>
            <button class="tool-btn" data-tool="circle" title="Circle">
              ○
            </button>
            <button class="tool-btn" data-tool="line" title="Line">─</button>
            <button class="tool-btn" data-tool="text" title="Text">T</button>
            <button class="tool-btn" data-tool="hand" title="Pan">✋</button>
          </aside>

          <div class="canvas-wrap" id="canvasWrap">
            <div class="editor-topbar">
              <div class="d-flex gap-2">
                <button class="btn-ghost" id="zoomOut">−</button>
                <span class="zoom-pill" id="zoomLevel">100%</span>
                <button class="btn-ghost" id="zoomIn">+</button>
              </div>
              <div class="d-flex gap-2">
                <button class="btn-ghost" id="toggleGrid">Grid</button>
                <button class="btn-ghost" id="deleteSelected">Delete</button>
                <button class="btn-app" id="saveDesign">Save</button>
              </div>
            </div>
            <div class="canvas-surface canvas-grid" id="canvasSurface"></div>
          </div>

          <aside
            class="glass-card properties-panel"
            id="propertiesPanel"
          ></aside>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/Eshared.js"></script>
    <script src="js/editor.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save reusable shape and text presets and view theme color tokens in Figma Lite."
    />
    <title>Assets | Figma Lite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="canonical" href="https://fazal305.github.io/figma-lite/assets.html" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/assets.css" />
  </head>
  <body data-page="assets">
    <div class="app-shell">
      <div data-sidebar></div>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-eyebrow">Reusable Presets</p>
            <h1 class="page-title">Assets</h1>
            <p class="page-description">
              Save reusable shape and text presets, view theme color tokens, and
              insert presets into the canvas state.
            </p>
          </div>
        </header>

        <section class="assets-layout">
          <div class="glass-card section-card">
            <div id="assetGrid" class="asset-grid"></div>
          </div>
          <aside class="glass-card section-card">
            <h2 class="card-title">Create Preset</h2>
            <input
              class="form-control mb-2"
              id="assetName"
              placeholder="Preset name"
            />
            <select class="form-select mb-2" id="assetType">
              <option value="rectangle">Rectangle</option>
              <option value="circle">Circle</option>
              <option value="line">Line</option>
              <option value="text">Text</option>
            </select>
            <button class="btn-app w-100 mb-2" id="createAssetPreset">
              Create Asset
            </button>
            <button class="btn-ghost w-100" id="loadDefaultAssets">
              Reload Defaults
            </button>
            <h2 class="card-title mt-4">Theme Tokens</h2>
            <div id="themeTokens" class="token-grid"></div>
          </aside>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/assets.js"></script>
  </body>
</html>

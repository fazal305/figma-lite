<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Preview, copy, and download SVG output from your Figma Lite design."
    />
    <title>Export | Figma Lite</title>
    <link rel="canonical" href="https://fazal305.github.io/figma-lite/export.html" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/export.css" />
  </head>
  <body data-page="export">
    <div class="app-shell">
      <div data-sidebar></div>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-eyebrow">Export Workflow</p>
            <h1 class="page-title">SVG Export</h1>
            <p class="page-description">
              Generate SVG from the actual canvas state, copy code, download
              SVG, export JSON, import JSON, and export selected layer.
            </p>
          </div>
        </header>

        <section class="export-layout">
          <div class="glass-card section-card">
            <div class="svg-preview-shell" id="svgPreview"></div>
            <textarea
              class="form-control export-code mt-3"
              id="svgCode"
            ></textarea>
          </div>
          <aside class="glass-card section-card export-actions">
            <div class="export-info-grid">
              <div class="export-info-card">
                <div class="export-info-value" id="exportSize">0 × 0</div>
                <div class="export-info-label">Export Size</div>
              </div>
              <div class="export-info-card">
                <div class="export-info-value" id="exportLayers">0</div>
                <div class="export-info-label">Visible Layers</div>
              </div>
            </div>
            <button class="btn-app" id="copySvgCode">Copy SVG Code</button>
            <button class="btn-app" id="downloadSvg">Download SVG</button>
            <button class="btn-ghost" id="downloadWorkspaceJson">
              Download Workspace JSON
            </button>
            <label class="import-drop"
              >Import Workspace JSON<input
                type="file"
                id="importWorkspaceJson"
                accept=".json"
                class="form-control mt-2"
            /></label>
            <button class="btn-ghost" id="exportSelectedLayerSvg">
              Export Selected Layer
            </button>
          </aside>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/Eshared.js"></script>
    <script src="js/export.js"></script>
  </body>
</html>

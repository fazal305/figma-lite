<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layers | Figma Lite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/layers.css" />
  </head>
  <body data-page="layers">
    <div class="app-shell">
      <div data-sidebar></div>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-eyebrow">Layer Manager</p>
            <h1 class="page-title">Layers</h1>
            <p class="page-description">
              Rename, reorder, hide, lock, delete, and select design layers from
              the shared canvas state.
            </p>
          </div>
          <a class="btn-app internal-link" href="editor.html">Back to Editor</a>
        </header>

        <section class="layers-layout">
          <div class="glass-card section-card">
            <div id="layersList" class="layers-list"></div>
          </div>
          <aside class="glass-card section-card">
            <h2 class="card-title">Layer Sync</h2>
            <p class="card-text">
              All changes update localStorage and appear in the editor after
              navigation or refresh.
            </p>
          </aside>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/Eshared.js"></script>
    <script src="js/layers.js"></script>
  </body>
</html>
